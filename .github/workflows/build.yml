name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 33
          build-tools-version: '34.0.0'
          ndk-version: '26.1.10909125'

      - name: Accept Android SDK Licenses & Setup cmdline-tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0" "platforms;android-33" "cmdline-tools;latest"

          # Copie des cmdline-tools là où Buildozer les attend
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          cp -r $ANDROID_HOME/cmdline-tools/latest/* /home/runner/.buildozer/android/platform/android-sdk/tools/ 2>/dev/null || true

          ls -la $ANDROID_HOME/build-tools/

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            autoconf \
            libtool \
            pkg-config \
            ccache \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            zip \
            unzip
          which git || (echo "Git installation failed" && exit 1)
          hash -r

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "Cython<3.0.0" buildozer

      - name: Link Android build-tools for Buildozer
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools
          ln -sf $ANDROID_HOME/build-tools/34.0.0 /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0
          ls -la /home/runner/.buildozer/android/platform/android-sdk/build-tools/

      - name: Build APK with Buildozer
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: '1'
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_BUILD_TOOLS_VERSION: '34.0.0'
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${{ env.ANDROID_HOME }}/build-tools/34.0.0
        run: |
          which git
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
